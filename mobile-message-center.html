<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>消息中心 - 合肥 BIM 数据中台</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#eef1ef;color:#303b34;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    button{font:inherit}
    .mobile-app{position:relative;width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:#f7f8fa;overflow:hidden}
    .app-header{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:44px 1fr 62px;align-items:center;height:48px;padding-top:env(safe-area-inset-top);border-bottom:1px solid #ebeeec;background:#fff}
    .app-header h1{margin:0;text-align:center;font-size:17px;font-weight:500;color:#202a24}
    .header-button{height:48px;border:0;background:transparent;color:#1a8a57;font-size:14px;cursor:pointer}
    .header-button.back{font-size:25px;color:#303b34}
    .message-tabs{position:sticky;top:48px;z-index:18;display:grid;grid-template-columns:1fr 1fr;height:46px;border-bottom:1px solid #e7ebe8;background:#fff}
    .message-tab{position:relative;border:0;background:transparent;color:#66736b;font-size:15px;cursor:pointer}
    .message-tab.active{color:#187a4d;font-weight:500}
    .message-tab.active:after{position:absolute;right:calc(50% - 18px);bottom:0;left:calc(50% - 18px);height:3px;border-radius:2px;background:#1a9f5f;content:""}
    .message-tab em{display:inline-grid;place-items:center;min-width:17px;height:17px;margin-left:4px;padding:0 4px;border-radius:9px;background:#eef4f0;color:#647169;font-size:10px;font-style:normal;vertical-align:1px}
    .message-tab.active em{background:#e2f2e8;color:#187a4d}
    .manage-strip{display:flex;align-items:center;justify-content:space-between;height:42px;padding:0 14px;border-bottom:1px solid #e5ebe7;background:#f1f7f3;color:#66736b;font-size:13px}
    .select-all{display:flex;align-items:center;gap:7px;cursor:pointer}
    .select-all input,.message-select input{width:17px;height:17px;margin:0;accent-color:#1a8a57}
    .manage-strip span{color:#87938b}
    .message-list{padding:12px 12px 82px}
    .message-card{position:relative;margin-bottom:10px;border:1px solid #e8ece9;border-radius:7px;background:#fff;overflow:hidden}
    .message-card.important{border-color:#ead9ad}
    .message-card-main{display:grid;grid-template-columns:1fr 40px;min-height:116px}
    .message-card.managing .message-card-main{grid-template-columns:42px 1fr 40px}
    .message-select{display:none;align-items:center;justify-content:center;border-right:1px solid #f0f2f1}
    .message-card.managing .message-select{display:flex}
    .message-open{padding:14px 6px 13px 14px;border:0;background:#fff;text-align:left;cursor:pointer}
    .message-subject{display:flex;align-items:center;gap:7px;margin-bottom:10px;color:#26332b;font-size:15px;font-weight:500;line-height:1.45}
    .unread-dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:#1a9f5f}
    .important-label{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:3px;background:#fff5d9;color:#9b7224;font-size:11px;font-weight:400}
    .message-meta{display:grid;gap:7px;color:#7d8981;font-size:12px;line-height:1.35}
    .message-meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .message-meta b{margin-right:7px;color:#58665d;font-weight:400}
    .card-action{display:flex;align-items:center;justify-content:center;border:0;background:#fff;color:#a5aea8;font-size:22px;cursor:pointer}
    .card-action.important{color:#d6a53e}
    .card-action.delete{color:#9d6b63;font-size:18px}
    .empty{padding:90px 20px;text-align:center;color:#939d97;font-size:14px}
    .batch-bar{position:absolute;right:0;bottom:0;left:0;z-index:22;display:flex;align-items:center;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #dfe6e1;background:#fff;box-shadow:0 -4px 12px rgba(30,61,43,.06)}
    .batch-bar span{flex:1;color:#68756d;font-size:13px}
    .batch-action{height:36px;padding:0 18px;border:1px solid #218658;border-radius:5px;background:#fff;color:#18774c;cursor:pointer}
    .batch-action.primary{background:#188556;color:#fff}
    .batch-action.danger{border-color:#c98579;color:#a34f43}
    .batch-action:disabled{border-color:#d7ddd9;background:#f3f5f4;color:#aab2ad;cursor:not-allowed}
    .sheet-mask{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;background:rgba(18,31,23,.36)}
    .sheet{width:100%;max-height:86vh;border-radius:12px 12px 0 0;background:#fff;overflow:auto}
    .sheet-head{position:sticky;top:0;display:grid;grid-template-columns:50px 1fr 50px;align-items:center;height:50px;border-bottom:1px solid #e8ece9;background:#fff}
    .sheet-head h2{margin:0;text-align:center;font-size:16px;font-weight:500}
    .sheet-head button{height:50px;border:0;background:transparent;color:#65736a;font-size:14px;cursor:pointer}
    .sheet-content{padding:20px 18px 32px}
    .sheet-content h3{margin:0 0 14px;color:#25332a;font-size:18px;font-weight:500;line-height:1.5}
    .detail-meta{display:grid;gap:8px;padding-bottom:16px;border-bottom:1px solid #edf0ee;color:#7c8880;font-size:12px}
    .detail-meta b{display:inline-block;width:60px;color:#56645b;font-weight:400}
    .sheet-content p{margin:18px 0 0;color:#4d5b52;font-size:14px;line-height:1.8}
    .confirm-box{align-self:center;width:calc(100% - 56px);margin:auto;border-radius:9px;background:#fff;overflow:hidden}
    .confirm-box h3{margin:0;padding:22px 20px 8px;text-align:center;font-size:17px;font-weight:500}
    .confirm-box p{margin:0;padding:0 22px 22px;color:#78847c;text-align:center;font-size:13px;line-height:1.6}
    .confirm-actions{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #e6ebe7}
    .confirm-actions button{height:46px;border:0;background:#fff;color:#66736b;cursor:pointer}
    .confirm-actions button+button{border-left:1px solid #e6ebe7;color:#a34f43}
    [hidden]{display:none!important}
    @media(min-width:431px){.mobile-app{min-height:860px;margin:24px auto;border:1px solid #dde4df;box-shadow:0 10px 30px rgba(37,62,47,.12)}}
  </style>
</head>
<body>
  <main class="mobile-app" id="mobileMessageApp">
    <header class="app-header">
      <button class="header-button back" type="button" aria-label="返回">‹</button>
      <h1>消息中心</h1>
      <button class="header-button" type="button" data-manage>管理</button>
    </header>
    <nav class="message-tabs" aria-label="消息状态">
      <button class="message-tab active" type="button" data-tab="unread">待阅 <em data-unread-count></em></button>
      <button class="message-tab" type="button" data-tab="read">已阅 <em data-read-count></em></button>
    </nav>
    <section class="manage-strip" data-manage-strip hidden>
      <label class="select-all"><input type="checkbox" data-select-all>全选</label>
      <span data-selected-label>已选择 0 条</span>
    </section>
    <section class="message-list" data-message-list></section>
    <footer class="batch-bar" data-batch-bar hidden>
      <span data-batch-summary>请选择消息</span>
      <button class="batch-action primary" type="button" data-batch-mark disabled>标记重要</button>
      <button class="batch-action danger" type="button" data-batch-delete disabled>删除</button>
    </footer>
    <section class="sheet-mask" data-detail-mask hidden>
      <article class="sheet" role="dialog" aria-modal="true" aria-label="消息详情">
        <header class="sheet-head"><span></span><h2>消息详情</h2><button type="button" data-close-detail>关闭</button></header>
        <div class="sheet-content" data-detail-content></div>
      </article>
    </section>
    <section class="sheet-mask" data-confirm-mask hidden>
      <article class="confirm-box" role="dialog" aria-modal="true" aria-label="删除确认">
        <h3>删除消息</h3>
        <p data-confirm-text></p>
        <div class="confirm-actions"><button type="button" data-cancel-delete>取消</button><button type="button" data-confirm-delete>删除</button></div>
      </article>
    </section>
  </main>
  <script>
    (() => {
      const app = document.getElementById('mobileMessageApp');
      const messages = [
        {id:1,read:false,important:true,sender:'BIM 数据管理平台',time:'2026-09-14 10:20',subject:'白玉兰测试20260203 数据质检已完成',content:'项目数据质检任务已完成，请进入质检结果查看本次检查情况。'},
        {id:2,read:false,important:false,sender:'项目负责人 · 张伟',time:'2026-09-14 09:35',subject:'联合工房项目模型资料已更新',content:'联合工房土建专业模型资料已更新，请及时查看最新版本。'},
        {id:3,read:false,important:false,sender:'审批中心',time:'2026-09-13 16:48',subject:'项目数据入库申请待审批',content:'您有一条项目数据入库申请待处理，请在审批中心完成审批。'},
        {id:4,read:false,important:false,sender:'系统管理员',time:'2026-09-13 14:12',subject:'平台维护时间调整通知',content:'平台计划维护时间已调整，请提前保存正在处理的业务数据。'},
        {id:5,read:true,important:true,sender:'BIM 数据管理平台',time:'2026-09-12 15:30',subject:'完整性检查已通过',content:'白玉兰测试20260203 完整性检查已通过，可继续发起数据质检。'},
        {id:6,read:true,important:false,sender:'审批中心',time:'2026-09-11 11:28',subject:'模型数据使用申请已同意',content:'您提交的模型数据使用申请已审批通过。'},
        {id:7,read:true,important:false,sender:'项目负责人 · 李敏',time:'2026-09-10 17:05',subject:'机电专业文件重新上传完成',content:'机电专业模型文件已重新上传，可重新执行相关检查。'}
      ];
      const state = {tab:'unread',managing:false,selected:new Set(),pendingDelete:[]};
      const list = app.querySelector('[data-message-list]');
      const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const visibleMessages = () => messages.filter(item => state.tab === 'unread' ? !item.read : item.read).sort((a,b) => Number(b.important) - Number(a.important));

      function render(){
        const current = visibleMessages();
        app.querySelectorAll('[data-tab]').forEach(button => button.classList.toggle('active',button.dataset.tab === state.tab));
        app.querySelector('[data-unread-count]').textContent = messages.filter(item => !item.read).length;
        app.querySelector('[data-read-count]').textContent = messages.filter(item => item.read).length;
        app.querySelector('[data-manage]').textContent = state.managing ? '完成' : '管理';
        app.querySelector('[data-manage-strip]').hidden = !state.managing;
        app.querySelector('[data-batch-bar]').hidden = !state.managing;
        app.querySelector('[data-batch-mark]').hidden = state.tab !== 'unread';
        app.querySelector('[data-batch-delete]').hidden = state.tab !== 'read';
        app.querySelector('[data-selected-label]').textContent = `已选择 ${state.selected.size} 条`;
        app.querySelector('[data-batch-summary]').textContent = state.selected.size ? `已选择 ${state.selected.size} 条消息` : '请选择消息';
        app.querySelector('[data-batch-mark]').disabled = state.selected.size === 0;
        app.querySelector('[data-batch-delete]').disabled = state.selected.size === 0;
        const selectAll = app.querySelector('[data-select-all]');
        selectAll.checked = current.length > 0 && current.every(item => state.selected.has(item.id));
        selectAll.disabled = current.length === 0;
        list.innerHTML = current.length ? current.map(item => `
          <article class="message-card ${item.important ? 'important' : ''} ${state.managing ? 'managing' : ''}" data-message-id="${item.id}">
            <div class="message-card-main">
              <label class="message-select" aria-label="选择消息"><input type="checkbox" data-select-message="${item.id}" ${state.selected.has(item.id) ? 'checked' : ''}></label>
              <button class="message-open" type="button" data-open-message="${item.id}">
                <div class="message-subject">${item.read ? '' : '<i class="unread-dot"></i>'}<span>${escapeHtml(item.subject)}</span>${item.important ? '<em class="important-label">重要</em>' : ''}</div>
                <div class="message-meta"><span><b>发送者</b>${escapeHtml(item.sender)}</span><span><b>发送时间</b>${escapeHtml(item.time)}</span></div>
              </button>
              ${state.tab === 'unread' ? `<button class="card-action ${item.important ? 'important' : ''}" type="button" data-toggle-important="${item.id}" aria-label="${item.important ? '取消重要标记' : '标记重要'}">★</button>` : `<button class="card-action delete" type="button" data-delete-one="${item.id}" aria-label="删除消息">删除</button>`}
            </div>
          </article>`).join('') : `<div class="empty">暂无${state.tab === 'unread' ? '待阅' : '已阅'}消息</div>`;
      }

      function resetSelection(){state.selected.clear();state.managing=false;}
      function requestDelete(ids){state.pendingDelete = ids;app.querySelector('[data-confirm-text]').textContent = ids.length > 1 ? `确定删除选中的 ${ids.length} 条已阅消息吗？删除后无法恢复。` : '确定删除这条已阅消息吗？删除后无法恢复。';app.querySelector('[data-confirm-mask]').hidden = false;}

      app.addEventListener('click',event => {
        const tab = event.target.closest('[data-tab]');
        if(tab){state.tab=tab.dataset.tab;resetSelection();render();return;}
        if(event.target.closest('[data-manage]')){state.managing=!state.managing;state.selected.clear();render();return;}
        const important = event.target.closest('[data-toggle-important]');
        if(important){const item=messages.find(message=>message.id===Number(important.dataset.toggleImportant));if(item)item.important=!item.important;render();return;}
        const open = event.target.closest('[data-open-message]');
        if(open && !state.managing){const item=messages.find(message=>message.id===Number(open.dataset.openMessage));if(!item)return;item.read=true;app.querySelector('[data-detail-content]').innerHTML=`<h3>${escapeHtml(item.subject)}</h3><div class="detail-meta"><span><b>发送者</b>${escapeHtml(item.sender)}</span><span><b>发送时间</b>${escapeHtml(item.time)}</span>${item.important?'<span><b>消息标记</b>重要</span>':''}</div><p>${escapeHtml(item.content)}</p>`;app.querySelector('[data-detail-mask]').hidden=false;render();return;}
        const singleDelete = event.target.closest('[data-delete-one]');
        if(singleDelete){requestDelete([Number(singleDelete.dataset.deleteOne)]);return;}
        if(event.target.closest('[data-batch-mark]')){messages.forEach(item=>{if(state.selected.has(item.id))item.important=true;});resetSelection();render();return;}
        if(event.target.closest('[data-batch-delete]')){requestDelete([...state.selected]);return;}
        if(event.target.closest('[data-close-detail]') || event.target === app.querySelector('[data-detail-mask]')){app.querySelector('[data-detail-mask]').hidden=true;return;}
        if(event.target.closest('[data-cancel-delete]') || event.target === app.querySelector('[data-confirm-mask]')){app.querySelector('[data-confirm-mask]').hidden=true;state.pendingDelete=[];return;}
        if(event.target.closest('[data-confirm-delete]')){state.pendingDelete.forEach(id=>{const index=messages.findIndex(item=>item.id===id);if(index>=0)messages.splice(index,1);});state.pendingDelete=[];app.querySelector('[data-confirm-mask]').hidden=true;resetSelection();render();}
      });
      app.addEventListener('change',event => {
        if(event.target.matches('[data-select-message]')){const id=Number(event.target.dataset.selectMessage);event.target.checked?state.selected.add(id):state.selected.delete(id);render();}
        if(event.target.matches('[data-select-all]')){const current=visibleMessages();current.forEach(item=>event.target.checked?state.selected.add(item.id):state.selected.delete(item.id));render();}
      });
      render();
    })();
  </script>
</body>
</html>
