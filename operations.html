<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国烟草合肥设计院 BIM+智慧运维</title><link rel="preload" as="image" href="operations-assets/office-clean.png"><link rel="preload" as="image" href="operations-assets/solar-reference.png"><link rel="stylesheet" href="operations.css"></head>
<body>
<header class="ops-header"><nav aria-label="运维系统"><button data-view="overview">首页</button><button data-view="solar">光储系统</button><button data-view="building">楼宇系统</button><button data-view="energy">能耗计量</button><button data-security>园区安防</button></nav><button class="ops-title" data-view="overview" title="返回园区总览">中国烟草合肥设计院<span>BIM+智慧运维</span></button><div class="header-actions"><button class="safety" data-safety>▣ 用电安全</button></div></header>
<main id="scene" data-scene="overview" aria-label="园区总览"></main>
<dialog id="safetyDialog" aria-labelledby="safetyTitle"><div class="dialog-title"><h2 id="safetyTitle"><i>▣</i> 用电安全实时状态</h2><button data-close aria-label="关闭">×</button></div><div class="dialog-body"><div class="safety-summary"><div>线缆温度监测 <span>76个</span><strong>全部正常</strong></div><div>漏电监测 <span>76个</span></div></div><h3><i>▣</i> 配电房状态</h3><div class="metric-grid"><div class="metric"><label>环境温度</label><b>22.9<small>℃</small></b></div><div class="metric"><label>环境湿度</label><b>73.3<small>%</small></b></div><div class="metric"><label>烟雾</label><b>0<small>/</small></b></div><div class="metric"><label>水浸</label><b>0<small>/</small></b></div></div></div></dialog>
<dialog id="securityDialog" aria-labelledby="securityTitle"><div class="dialog-title"><h2 id="securityTitle">园区安防</h2><button data-close aria-label="关闭">×</button></div><div class="security-message"><span>ⓘ</span><p>系统暂未对接</p><button data-close>我知道了</button></div></dialog>
<script src="operations.js"></script></body></html>
